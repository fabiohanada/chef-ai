<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Taxa de Entrega - {{ restaurant.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 max-w-md w-full p-6">
        <h1 class="text-xl font-bold text-gray-800 mb-4">✏️ Editar Taxa de Entrega</h1>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Bairro</label>
                <input type="text" name="neighborhood" value="{{ fee.neighborhood }}" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Taxa (R$)</label>
                <input type="number" step="0.01" name="fee" value="{{ fee.fee }}" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="flex justify-end gap-3 pt-4 border-t">
                <a href="{% url 'restaurant_admin' restaurant.slug %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-2 rounded-lg text-sm transition">
                    Cancelar
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-lg text-sm transition">
                    Guardar Alterações
                </button>
            </div>
        </form>
    </div>
</body>
</html>
