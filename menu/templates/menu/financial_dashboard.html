<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro - {{ restaurant.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Dashboard Financeiro</h1>
            <p class="text-sm text-gray-500">{{ restaurant.name }}</p>
        </div>
        
        <div class="flex items-center gap-4">
            <a href="{% url 'kitchen_dashboard' restaurant.slug %}" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                🍳 Voltar à Cozinha
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        
        <!-- Barra de Filtros -->
        <div class="mb-6 bg-white p-2 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-2 w-max">
            <a href="?filter=today" class="px-4 py-2 text-sm font-medium rounded-lg transition {% if current_filter == 'today' %}bg-green-600 text-white shadow-md{% else %}text-gray-600 hover:bg-gray-50{% endif %}">Hoje</a>
            <a href="?filter=7days" class="px-4 py-2 text-sm font-medium rounded-lg transition {% if current_filter == '7days' %}bg-green-600 text-white shadow-md{% else %}text-gray-600 hover:bg-gray-50{% endif %}">Últimos 7 dias</a>
            <a href="?filter=month" class="px-4 py-2 text-sm font-medium rounded-lg transition {% if current_filter == 'month' %}bg-green-600 text-white shadow-md{% else %}text-gray-600 hover:bg-gray-50{% endif %}">Este Mês</a>
            <a href="?filter=all" class="px-4 py-2 text-sm font-medium rounded-lg transition {% if current_filter == 'all' %}bg-green-600 text-white shadow-md{% else %}text-gray-600 hover:bg-gray-50{% endif %}">Todo o Histórico</a>
        </div>

        <!-- Cards de Faturamento -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Total Faturado</p>
                    <h3 class="text-3xl font-bold text-gray-800 mt-2">R$ {{ total_revenue|floatformat:2 }}</h3>
                </div>
                <div class="bg-green-50 p-4 rounded-xl text-green-600 text-2xl">💰</div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Pedidos Concluídos</p>
                    <h3 class="text-3xl font-bold text-gray-800 mt-2">{{ total_orders_count }}</h3>
                </div>
                <div class="bg-blue-50 p-4 rounded-xl text-blue-600 text-2xl">📦</div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Ticket Médio</p>
                    <h3 class="text-3xl font-bold text-gray-800 mt-2">R$ {{ average_ticket|floatformat:2 }}</h3>
                </div>
                <div class="bg-orange-50 p-4 rounded-xl text-orange-600 text-2xl">📊</div>
            </div>
        </div>

    </main>
</body>
</html>
