<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ restaurant.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mt-10">
        
        <!-- Cabeçalho do Formulário -->
        <div class="bg-gray-800 px-6 py-4 flex justify-between items-center">
            <h2 class="text-lg font-bold text-white">{{ title }}</h2>
            <a href="{% url 'restaurant_admin' restaurant.slug %}" class="text-gray-300 hover:text-white text-sm font-medium transition">✕ Fechar</a>
        </div>

        <!-- O enctype é essencial para a foto do produto funcionar! -->
        <form method="POST" enctype="multipart/form-data" class="p-6">
            {% csrf_token %}
            
            <div class="space-y-5">
                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                        {{ field }}
                        <!-- Mostra mensagens de erro se o utilizador esquecer de preencher algo -->
                        {% if field.errors %}
                            <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <!-- Botões -->
            <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-100">
                <a href="{% url 'restaurant_admin' restaurant.slug %}" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition">
                    Cancelar
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</body>
</html>
